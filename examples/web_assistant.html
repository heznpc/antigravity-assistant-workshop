<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실습 준비 비서</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #18284b; background: #edf2fa; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(12px, 3vw, 32px); }
  main { max-width: 960px; margin: auto; overflow: hidden; background: #fff; border: 1px solid #c1cde2; border-radius: 20px; box-shadow: 0 10px 28px #172d4d12; }
  header { background: #e1e9f8; padding: 11px 25px; display: flex; gap: 12px; align-items: center; font-size: clamp(17px, 2.1vw, 23px); }
  header code { background: #f7faff; border-radius: 8px; padding: 4px 12px; overflow-wrap: anywhere; }
  svg { flex: none; width: 1.15em; height: 1.15em; }
  .content { padding: clamp(20px, 4vw, 37px) clamp(20px, 5vw, 48px); }
  h1 { font-size: clamp(36px, 5.2vw, 54px); letter-spacing: -.045em; margin: 0 0 16px; line-height: 1.1; }
  label, h2 { display: flex; align-items: center; gap: 9px; font-size: clamp(20px, 2.6vw, 27px); font-weight: 750; margin: 0 0 8px; }
  textarea { display: block; width: 100%; resize: vertical; min-height: 64px; border: 1px solid #7990b7; border-radius: 9px; padding: 12px 15px; font: inherit; font-size: clamp(17px, 2.5vw, 25px); color: #17294f; }
  button { display: inline-flex; align-items: center; gap: 9px; margin-top: 10px; padding: 9px 17px; border: 0; border-radius: 9px; color: white; background: #244889; font: inherit; font-size: clamp(18px, 2.4vw, 23px); font-weight: 700; cursor: pointer; }
  button:hover { background: #173468; }
  :focus-visible { outline: 3px solid #5276b8; outline-offset: 3px; }
  section { margin-top: 23px; padding: 16px 20px; border: 1px solid #bac9e4; border-left: 5px solid #4165a8; background: #f4f7fe; border-radius: 10px; }
  pre { margin: 0; color: #263d67; font: inherit; font-size: clamp(17px, 2.4vw, 24px); line-height: 1.56; white-space: pre-wrap; overflow-wrap: anywhere; }
  [role=alert] { color: #9c1d29; font-weight: 700; }
</style>
</head>
<body>
<main aria-labelledby="title">
  <header><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="18" x="3" y="3" rx="2" />
  <path d="M3 9h18" />
  <path d="M9 21V9" />
</svg><code>http://127.0.0.1:8000</code></header>
  <div class="content">
    <h1 id="title">실습 준비 비서</h1>
    <form method="post" action="/">
      <label for="prompt">비서에게 맡길 일</label>
      <textarea id="prompt" name="prompt" rows="1" maxlength="500" required>${prompt}</textarea>
      <button type="submit"><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
  <path d="m21.854 2.147-10.94 10.939" />
</svg>비서에게 요청</button>
    </form>
    <p role="alert" ${error_hidden}>${error}</p>
    <section aria-labelledby="result" ${result_hidden}>
      <h2 id="result"><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <path d="m3 7 2 2 4-4" />
</svg>준비물 체크리스트</h2>
      <pre>${result}</pre>
    </section>
  </div>
</main>
</body>
</html>
